[[data_stream]]
id = "dropped_packets_rate"
name = "Dropped Packets Rate"
description = "Percent of packets that were lost or corrupted in transit"
type = "status"
unit = "%"
range = [0, 100]
nominal = [0, 10] 
message_type = "SYS_STATUS"
field_name = "drop_rate_comm"
sample_rate_hz = 1 #Hz

[[data_stream]]
id = "dropped_packets"
name = "Dropped Packets"
description = "Number of packets that were lost or corrupted in transit"
type = "status"
unit = "int"
message_type = "SYS_STATUS"
field_name = "errors_comm"
sample_rate_hz = 1 #Hz