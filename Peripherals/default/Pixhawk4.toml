[meta]
name = "Pixhawk 4"
description = "Generic Pixhawk 4"
type = "drone"
notes = ""
parent = "drone"

# ── Interfaces ─────────────────────────────────────────────────────────
[[interface]]
id = "mavlink"
name = "MAVLink"
description = "MAVLink Interface"
type = "serial"
protocol = "mavlink"
device = "/dev/ttyACM0"
		# USB: Linux "/dev/ttyACM0" | Windows "COM5" | macOS "/dev/tty.usbmodemXXXX"
		# Radio: the port of your ground-side radio, e.g. "/dev/ttyUSB0" or "COM7"
		# Simulated: PX4 "udpin:localhost:14540" | ArduPilot "udpin:localhost:14551"
baud = 115200
timeout = 5

# ── Lockouts ───────────────────────────────────────────────────────────
[[actuator]]
id = "abort"
#message_type = "MAV_CMD_DO_FLIGHTTERMINATION"
#params = [1,0,0,0,0,0,0]

# ── Phases ─────────────────────────────────────────────────────────────
[[actuator]]
id = "flight_phase"
name = "Flight Phase"
description = "Phase of flight selector/display"
type = "selector"
default = "startup"
nominal = "pad"

[[state]]
id = "startup"
name = "Startup"
description = "Vehicle is powering on"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.pad"]
sources = ["auto", "peripheral"]

[[state]]
id = "pre_flight"
name = "Pre-Flight"
description = "Vehicle preparing for flight"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.flight"]
sources = ["auto", "user", "peripheral"]

[[state]]
id = "flight"
name = "Flight"
description = "Vehicle in flight"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.pre_flight", "phase.shutdown"]
armed_by = ["lockout.main_lock"] # all must be true
disarmed_by = ["lockout.abort"] # all must be false
sources = ["user", "peripheral"]

[[state]]
id = "shutdown"
name = "Shutdown"
description = "Vehicle is powering down"
type = "phase"
parent = "flight_phase"
transition_to = []
sources = ["auto", "user", "peripheral"]

# ── NAVIGATION ─────────────────────────────────────────────────────────
[[actuator]]
id = "blink_led"
name = "Blink LED"
description = "Blinks the onboard debug LED"
type = "button"
armed_by = ["lockout.main_lock"] # all must be true
disarmed_by = ["abort.abort", "phase.startup"] # all must be false
sources = ["auto", "user", "peripheral"]

# ── POSITION ───────────────────────────────────────────────────────────
[[data_stream]]
id = "pos_x"
name = "Position X"
description = "Position in the X axis"
type = "position"
component = "x"
unit = "m"
range = [-50_000.0, 50_000.0]
nominal = [-5_000.0, 5_000.0]
message_type = "LOCAL_POSITION_NED"
field_name = "x"
sample_rate_hz = 5

[[data_stream]]
id = "pos_y"
name = "Position Y"
description = "Position in the Y axis"
type = "position"
component = "y"
unit = "m"
range = [-50_000.0, 50_000.0]
nominal = [-5_000.0, 5_000.0]
message_type = "LOCAL_POSITION_NED"
field_name = "y"
sample_rate_hz = 5

[[data_stream]]
id = "pos_z"
name = "Position Z"
description = "Position in the Z axis"
type = "position"
component = "z"
unit = "m"
range = [-500.0, 100_000.0]
nominal = [0.0, 30_000.0]
message_type = "LOCAL_POSITION_NED"
field_name = "z"
sample_rate_hz = 5

# ── VELOCITY ───────────────────────────────────────────────────────────
[[data_stream]]
id = "vel_x"
name = "Velocity X"
description = "Velocity in the X axis"
type = "velocity"
component = "x"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]
message_type = "LOCAL_POSITION_NED"
field_name = "vx"
sample_rate_hz = 5

[[data_stream]]
id = "vel_y"
name = "Velocity Y"
description = "Velocity in the Y axis"
type = "velocity"
component = "y"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]
message_type = "LOCAL_POSITION_NED"
field_name = "vy"
sample_rate_hz = 5

[[data_stream]]
id = "vel_z"
name = "Velocity Z"
description = "Velocity in the Z axis"
type = "velocity"
component = "z"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]
message_type = "LOCAL_POSITION_NED"
field_name = "vz"
sample_rate_hz = 5

# ── ACCELERATION ───────────────────────────────────────────────────────
[[data_stream]]
id = "accel_x"
name = "Acceleration X"
description = "Acceleration in the X axis"
type = "acceleration"
component = "x"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]
message_type = "HIGHRES_IMU"
field_name = "xacc"
sample_rate_hz = 5

[[data_stream]]
id = "accel_y"
name = "Acceleration Y"
description = "Acceleration in the Y axis"
type = "acceleration"
component = "y"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]
message_type = "HIGHRES_IMU"
field_name = "yacc"
sample_rate_hz = 5

[[data_stream]]
id = "accel_z"
name = "Acceleration Z"
description = "Acceleration in the Z axis"
type = "acceleration"
component = "z"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]
message_type = "HIGHRES_IMU"
field_name = "zacc"
sample_rate_hz = 5

# ── ATTITUDE ───────────────────────────────────────────────────────────
[[data_stream]]
id = "pitch"
name = "Pitch"
description = "Rotation along the X axis"
type = "attitude"
component = "pitch"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]
message_type = "ATTITUDE"
field_name = "pitch"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "roll"
name = "Roll"
description = "Rotation along the Z axis"
type = "attitude"
component = "roll"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]
message_type = "ATTITUDE"
field_name = "roll"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "yaw"
name = "Yaw"
description = "Rotation along the Y axis"
type = "attitude"
component = "yaw"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-180.0, 180.0]
message_type = "ATTITUDE"
field_name = "yaw"
sample_rate_hz = 5 #Hz

# ── ATTITUDE RATE ───────────────────────────────────────────────────────────
[[data_stream]]
id = "pitch_rate"
name = "Pitch Rate"
description = "Rotation rate along the X axis"
type = "attitude_rate"
component = "pitch"
unit = "deg/s"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]
message_type = "ATTITUDE"
field_name = "pitchspeed"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "roll_rate"
name = "Roll Rate"
description = "Rotation rate along the Z axis"
type = "attitude_rate"
component = "roll"
unit = "deg/s"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]
message_type = "ATTITUDE"
field_name = "rollspeed"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "yaw_rate"
name = "Yaw Rate"
description = "Rotation rate along the Y axis"
type = "attitude_rate"
component = "yaw"
unit = "deg/s"
range = [-180.0, 180.0]
nominal = [-180.0, 180.0]
message_type = "ATTITUDE"
field_name = "yawspeed"
sample_rate_hz = 5 #Hz

# ── GPS ────────────────────────────────────────────────────────────────
[[data_stream]]
id = "gps_lat"
name = "GPS Latitude"
description = "GPS Latitude Coordinate"
type = "gps"
component = "latitude"
unit = "deg"
range = [-90.0, 90.0]
nominal = [25.0, 50.0] # CONUS — tighten to your launch site
message_type = "GLOBAL_POSITION_INT"
field_name = "lat"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "gps_lon"
name = "GPS Longitude"
description = "GPS Longitude Coordinate"
type = "gps"
component = "longitude"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-125.0, -65.0] # CONUS — tighten to your launch site
message_type = "GLOBAL_POSITION_INT"
field_name = "lon"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "gps_alt"
name = "GPS Altitude"
description = "GPS Altitude Coordinate"
type = "gps"
component = "altitude"
unit = "m"
range = [-500.0, 100_000.0]
nominal = [0.0, 30_000.0]
message_type = "GLOBAL_POSITION_INT"
field_name = "alt"
sample_rate_hz = 5 #Hz

[[data_stream]]
id = "gps_time"
name = "GPS Time"
description = "GPS Time Coordinate"
type = "gps"
component = "time"
unit = "s"
range = [0.0, 9_999_999_999.0]
nominal = [0.0, 9_999_999_999.0]   # validated by staleness check, not bounds
message_type = "GLOBAL_POSITION_INT"
field_name = "time_boot_ms"
sample_rate_hz = 5 #Hz

