[meta]
name = "Drone"
description = "Generic Drone"
type = "drone"

[meta.switch_display]
namePosition = "top"
nameAlign = "center"
valueAlign = "center"

# ── Lockouts ───────────────────────────────────────────────────────────
[[actuator]]
id = "abort"
name = "Abort"
description = "Emergency shutdown"
type = "abort"
sync_group = "abort"
default = false

[[actuator]]
id = "main_lock"
name = "Main Lockout"
description = "Disarms all other lockouts and actuators"
type = "lockout"
sync_group = "main_lock"
default = false
armed_by = [] # all must be true
disarmed_by = ["lockout.abort"] # all must be false

# ── Logging ────────────────────────────────────────────────────────────
[[actuator]]
id = "logging"
name = "Logging"
description = "Log commands and data to csv file"
type = "switch"
sync_group = "logging"
default = false

# ── Phases ─────────────────────────────────────────────────────────────
[[actuator]]
id = "flight_phase"
name = "Flight Phase"
description = "Phase of flight selector/display"
type = "selector"
default = "startup"
nominal = "pad"

[[state]]
id = "startup"
name = "Startup"
description = "Vehicle is powering on"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.pad"]
sources = ["auto", "peripheral"]

[[state]]
id = "pre_flight"
name = "Pre-Flight"
description = "Vehicle preparing for flight"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.flight"]
sources = ["auto", "user", "peripheral"]

[[state]]
id = "flight"
name = "Flight"
description = "Vehicle in flight"
type = "phase"
parent = "flight_phase"
transition_to = ["phase.pre_flight", "phase.shutdown"]
armed_by = ["lockout.main_lock"] # all must be true
disarmed_by = ["lockout.abort"] # all must be false
sources = ["user", "peripheral"]

[[state]]
id = "shutdown"
name = "Shutdown"
description = "Vehicle is powering down"
type = "phase"
parent = "flight_phase"
transition_to = []
sources = ["auto", "user", "peripheral"]