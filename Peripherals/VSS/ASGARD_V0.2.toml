[meta]
name = "ASGARD V0.2"
description = "Generic ASGARD V0.2"
type = "rocket"
notes = ""
parent = "rocket"

# ── Interfaces ─────────────────────────────────────────────────────────
[[interface]]
id = "elrs"
name = "ELRS"
description = "ELRS Radio Interface"
type = "radio"
protocol = "elrs"
freq = 915_000_000
baud = 57600

# ── Lockouts ───────────────────────────────────────────────────────────
[[lockout]]
id = "pyro_arm"
name = "Pyro Arm"
description = "Arms Pyro Channels"
default = false
armed_by = ["lockout.main_lock"] # all must be true
disarmed_by = ["lockout.abort", "phase.startup", "phase.pad", "phase.landed"] # all must be false
debug_only = true

[[lockout]]
id = "servo_arm"
name = "Servo Arm"
description = "Arms Servos"
default = false
armed_by = ["lockout.main_lock"] # all must be true
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"] # all must be false

[[lockout]]
id = "launch_arm"
name = "Launch Arm"
description = "Arms For Launch"
default = false
armed_by = ["lockout.main_lock", "lockout.pyro_arm", "lockout.servo_arm"] # all must be true
disarmed_by = ["lockout.abort", "phase.startup", "phase.pad", "phase.landed"] # all must be false

# ── SERVOS ─────────────────────────────────────────────────────────────
[[actuator]]
id = "fin_servo_pos_x"
name = "Fin X+"
description = "Fin deflection servo in the positive X direction"
type = "servo"
subtype = "fin"
pin = 9
unit = "deg"
range = [-30.0, 30.0]
default_position = 0.0
slew_rate_max = 120.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

[[actuator]]
id = "fin_servo_neg_x"
name = "Fin X-"
description = "Fin deflection servo in the negative X direction"
type = "servo"
subtype = "fin"
pin = 6
unit = "deg"
range = [-30.0, 30.0]
default_position = 0.0
slew_rate_max = 120.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

[[actuator]]
id = "fin_servo_pos_y"
name = "Fin Y+"
description = "Fin deflection servo in the positive Y direction"
type = "servo"
subtype = "fin"
pin = 5
unit = "deg"
range = [-30.0, 30.0]
default_position = 0.0
slew_rate_max = 120.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

[[actuator]]
id = "fin_servo_neg_y"
name = "Fin Y-"
description = "Fin deflection servo in the negative Y direction"
type = "servo"
subtype = "fin"
pin = 4
unit = "deg"
range = [-30.0, 30.0]
default_position = 0.0
slew_rate_max = 120.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

[[actuator]]
id = "tvc_servo_x"
name = "TVC X"
description = "Thrust vector control servo in the X direction"
type = "servo"
subtype = "tvc"
pin = 3
unit = "deg"
range = [-8.0, 8.0]
default_position = 0.0
slew_rate_max = 60.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

[[actuator]]
id = "tvc_servo_y"
name = "TVC Y"
description = "Thrust vector control servo in the Y direction"
type = "servo"
subtype = "tvc"
pin = 2
unit = "deg"
range = [-8.0, 8.0]
default_position = 0.0
slew_rate_max = 60.0
armed_by = ["lockout.main_lock", "lockout.servo_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.landed"]

# ── PYROS ──────────────────────────────────────────────────────────────
[[actuator]]
id = "pyro_drogue"
name = "Drogue Pyro"
description = "Ejects the drogue chute"
type = "pyro"
channel = 1
channel_a = 14
channel_b = 21
unit = "bool"
armed_by = ["lockout.main_lock", "lockout.pyro_arm", "lockout.launch_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.pad", "phase.landed"]
debug_only = true

[[actuator]]
id = "pyro_main"
name = "Main Pyro"
description = "Ejects the main chute"
type = "pyro"
channel = 2
channel_a = 15
channel_b = 22
unit = "bool"
armed_by = ["lockout.main_lock", "lockout.pyro_arm", "lockout.launch_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.pad", "phase.landed"]
debug_only = true

[[actuator]]
id = "pyro_motor"
name = "Motor Pyro"
description = "Ignites the motor"
type = "pyro"
channel = 3
channel_a = 20
channel_b = 23
unit = "bool"
armed_by = ["lockout.main_lock", "lockout.pyro_arm", "lockout.launch_arm"]
disarmed_by = ["lockout.abort", "phase.startup", "phase.pad", "phase.landed"]
debug_only = true

# ── POSITION ───────────────────────────────────────────────────────────
[[data_stream]]
id = "pos_x"
name = "Position X"
description = "Position in the X axis"
type = "position"
component = "x"
unit = "m"
range = [-50_000.0, 50_000.0]
nominal = [-5_000.0, 5_000.0]

[[data_stream]]
id = "pos_y"
name = "Position Y"
description = "Position in the Y axis"
type = "position"
component = "y"
unit = "m"
range = [-50_000.0, 50_000.0]
nominal = [-5_000.0, 5_000.0]

[[data_stream]]
id = "pos_z"
name = "Position Z"
description = "Position in the Z axis"
type = "position"
component = "z"
unit = "m"
range = [-500.0, 100_000.0]
nominal = [0.0, 30_000.0]

# ── VELOCITY ───────────────────────────────────────────────────────────
[[data_stream]]
id = "vel_x"
name = "Velocity X"
description = "Velocity in the X axis"
type = "velocity"
component = "x"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]

[[data_stream]]
id = "vel_y"
name = "Velocity Y"
description = "Velocity in the Y axis"
type = "velocity"
component = "y"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]

[[data_stream]]
id = "vel_z"
name = "Velocity Z"
description = "Velocity in the Z axis"
type = "velocity"
component = "z"
unit = "m/s"
range = [-2_000.0, 2_000.0]
nominal = [-500.0, 500.0]

# ── ACCELERATION ───────────────────────────────────────────────────────
[[data_stream]]
id = "accel_x"
name = "Acceleration X"
description = "Acceleration in the X axis"
type = "acceleration"
component = "x"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]

[[data_stream]]
id = "accel_y"
name = "Acceleration Y"
description = "Acceleration in the Y axis"
type = "acceleration"
component = "y"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]

[[data_stream]]
id = "accel_z"
name = "Acceleration Z"
description = "Acceleration in the Z axis"
type = "acceleration"
component = "z"
unit = "m/s^2"
range = [-160.0, 160.0]
nominal = [-20.0, 20.0]

# ── ATTITUDE ───────────────────────────────────────────────────────────
[[data_stream]]
id = "pitch"
name = "Pitch"
description = "Rotation along the X axis"
type = "attitude"
component = "pitch"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]

[[data_stream]]
id = "roll"
name = "Roll"
description = "Rotation along the Z axis"
type = "attitude"
component = "roll"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-30.0, 30.0]

[[data_stream]]
id = "yaw"
name = "Yaw"
description = "Rotation along the Y axis"
type = "attitude"
component = "yaw"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-180.0, 180.0]

# ── HEADING ────────────────────────────────────────────────────────────
[[data_stream]]
id = "heading"
name = "Heading"
description = "Magnetic Heading (Compass)"
type = "compass"
unit = "deg"
range = [0.0, 360.0]
nominal = [0.0, 360.0]

# ── PRESSURE ───────────────────────────────────────────────────────────
[[data_stream]]
id = "static_pressure"
name = "Static Pressure"
description = "Static pressure of the surrounding air"
type = "pressure"
unit = "Pa"
range = [10_000.0, 110_000.0]
nominal = [80_000.0, 102_000.0]

# ── GPS ────────────────────────────────────────────────────────────────
[[data_stream]]
id = "gps_lat"
name = "GPS Latitude"
description = "GPS Latitude Coordinate"
type = "gps"
component = "latitude"
unit = "deg"
range = [-90.0, 90.0]
nominal = [25.0, 50.0] # CONUS — tighten to your launch site

[[data_stream]]
id = "gps_lon"
name = "GPS Longitude"
description = "GPS Longitude Coordinate"
type = "gps"
component = "longitude"
unit = "deg"
range = [-180.0, 180.0]
nominal = [-125.0, -65.0] # CONUS — tighten to your launch site

[[data_stream]]
id = "gps_alt"
name = "GPS Altitude"
description = "GPS Altitude Coordinate"
type = "gps"
component = "altitude"
unit = "m"
range = [-500.0, 100_000.0]
nominal = [0.0, 30_000.0]

[[data_stream]]
id = "gps_time"
name = "GPS Time"
description = "GPS Time Coordinate"
type = "gps"
component = "time"
unit = "unix_s"
range = [0.0, 9_999_999_999.0]
nominal = [0.0, 9_999_999_999.0]   # validated by staleness check, not bounds

